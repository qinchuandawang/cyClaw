[workspace]
members = [
  "crates/cyclaw-change-radar",
  "crates/cyclaw-cli",
  "crates/cyclaw-core",
  "crates/cyclaw-scanner",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["cyClaw contributors"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
